name: Chup
options:
  bundleIdPrefix: com.chup
  deploymentTarget:
    macOS: '15.0'
packages:
  ChupCore:
    path: .
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: 57551cd90e0bbec342766244358bcf08afb05290
  Argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    revision: ea872ffd35705aa757f33033500b9b0d40bd38df
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit.git
    revision: cd0b3e52d537db115ad3a9d89601f20e0bee8d27
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: 88
targets:
  Chup:
    type: application
    productName: Chup!
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/ChupIcon.icon
      - path: App/Resources/ChupIcon.icon
        type: file
    dependencies:
      - package: ChupCore
        product: ChupCore
      - package: ChupCore
        product: CAudioSafety
      - package: FluidAudio
        product: FluidAudio
      - package: Argmax
        product: WhisperKit
      - package: DynamicNotchKit
        product: DynamicNotchKit
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Chup!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Record your voice for dictation and meeting notes when you start capture.
        NSAudioCaptureUsageDescription: Record audio from the meeting application you select, on a separate local track.
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Resources/Chup.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chup.mac
        PRODUCT_NAME: Chup!
        ASSETCATALOG_COMPILER_APPICON_NAME: ChupIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Chup:
    build:
      targets:
        Chup: all
    run:
      config: Debug
